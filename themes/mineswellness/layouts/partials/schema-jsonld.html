{{- $siteTitle := "Mine's Wellness" -}}
{{- if .IsHome -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ .Site.BaseURL }}#website",
  "url": {{ .Site.BaseURL | jsonify }},
  "name": {{ $siteTitle | jsonify }},
  "description": {{ .Site.Params.description | jsonify }},
  "potentialAction": {
    "@type": "SearchAction",
    "target": {{ printf "%s?s={search_term_string}" .Site.BaseURL | jsonify }},
    "query-input": "required name=search_term_string"
  }
}
</script>
{{- else if eq .Section "posts" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ (.Params.description | default .Summary) | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ (.Lastmod | default .Date).Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": { "@type": "Person", "name": {{ (.Params.author | default "Admin") | jsonify }} },
  "publisher": { "@type": "Organization", "name": {{ $siteTitle | jsonify }} },
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ .Permalink | absURL | jsonify }} }
  {{- with .Params.ogImage -}}
  ,"image": {{ . | absURL | jsonify }}
  {{- end -}}
}
</script>
{{- end -}}
