{{- $related := .Site.RegularPages.Related . | first 3 -}}
{{- if $related -}}
<aside class="related-posts" aria-label="Related articles">
  <h3 class="related-posts-title">Related articles</h3>
  <ul>
    {{- range $related -}}
      <li><a href="{{ .RelPermalink }}" rel="bookmark">{{ .Title }}</a></li>
    {{- end -}}
  </ul>
</aside>
{{- end -}}
